
name: Portfolio Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HTML Validator
        run: npm install --global html-validate

      - name: Validate HTML
        run: html-validate index.html

      - name: Validate JavaScript
        run: node --check js/main.js

      - name: Install CSS Validator
        run: npm install --no-save --no-package-lock stylelint stylelint-config-standard

      - name: Validate CSS
        run: npx stylelint "css/**/*.css" --config .stylelintrc.json
